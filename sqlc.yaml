version: '2'
plugins:
- name: moonbit
  process:
    cmd: ./target/native/release/build/cmd/main/main.exe
sql:
- name: sqlite
  schema: sqlite/schema.sql
  queries: sqlite/query.sql
  engine: sqlite
  database:
    uri: file:authors?mode=memory&cache=shared
  codegen:
  - out: generated
    plugin: moonbit